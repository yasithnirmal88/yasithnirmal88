<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#00d9ff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="300" stroke="#00d9ff" stroke-width="1"/>
  </g>
  
  <!-- Code brackets decoration -->
  <text x="80" y="90" font-family="'Fira Code', monospace" font-size="60" fill="#00d9ff" opacity="0.3" filter="url(#glow)">{</text>
  <text x="1080" y="230" font-family="'Fira Code', monospace" font-size="60" fill="#00d9ff" opacity="0.3" filter="url(#glow)">}</text>
  
  <!-- Main title -->
  <text x="600" y="130" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="48" font-weight="700" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">YASITH NIRMAL PEIRIS</text>
  
  <!-- Subtitle -->
  <text x="600" y="175" font-family="'Fira Code', monospace" font-size="24" fill="#c9d1d9" text-anchor="middle">Cloud &amp; Full-Stack Engineer | AI &amp; CleanTech Enthusiast</text>
  
  <!-- Tagline -->
  <text x="600" y="220" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">Building Scalable Solutions • Driving Innovation Through Code</text>
  
  <!-- Bottom accent line -->
  <rect x="200" y="260" width="800" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
